        <script>
          function importFlow(event) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                try {
                  const jsonData = JSON.parse(e.target.result);
                  const validModules = ['Home', 'Other']; // Define valid module names
                  const moduleNames = Object.keys(jsonData.drawflow || {});
                  const invalidModules = moduleNames.filter(name => !validModules.includes(name));

                  if (
                    jsonData &&
                    jsonData.drawflow &&
                    typeof jsonData.drawflow === 'object' &&
                    moduleNames.length > 0 &&
                    invalidModules.length === 0 &&
                    jsonData.drawflow.Home
                  ) {
                    editor.clearModuleSelected(); // Clear current module
                    editor.import(jsonData); // Import the JSON data
                    editor.changeModule('Home'); // Ensure the "Home" module is active
                    currentWorkflowId = null;
                    currentWorkflowTitle = '';
                    Swal.fire('Success', 'Flow imported successfully!', 'success');
                  } else {
                    console.error('Invalid JSON structure:', jsonData);
                    if (!jsonData.drawflow) {
                      console.error('Missing "drawflow" object in JSON.');
                      console.log('Ensure the JSON file contains a "drawflow" object at the root level.');
                    } else if (!jsonData.drawflow.Home) {
                      console.error('Missing "Home" module in "drawflow" object.');
                      console.log('Ensure the "drawflow" object contains a "Home" module with valid data.');
                    } else if (!jsonData.drawflow.Home.data || typeof jsonData.drawflow.Home.data !== 'object') {
                      console.error('Invalid or missing "data" in "Home" module.');
                      console.log('Ensure the "Home" module contains a "data" object with node definitions.');
                    } else {
                      console.error('Unexpected issue with JSON structure.');
                      console.log('Check the JSON file for any structural issues.');
                    }
                    if (invalidModules.length > 0) {
                      console.error('Invalid module names:', invalidModules);
                      console.log('Valid module names are:', validModules);
                    }
                    console.log('Expected structure: {"drawflow": {"Home": {"data": { ... }}}}');
                    Swal.fire(
                      'Error',
                      'Invalid JSON structure! Please ensure the file contains a valid "drawflow" object with a "Home" module. Check the console for the expected structure.',
                      'error'
                    );
                  }
                } catch (error) {
                  console.error('Error parsing JSON:', error.message);
                  Swal.fire('Error', `Invalid JSON file! Error: ${error.message}. Please ensure the file is properly formatted and contains a valid "drawflow" object.`, 'error');
                }
              };
              reader.readAsText(file);
            }
          }
        </script>

    /* DRAG EVENT */

    /* Mouse and Touch Actions */

    function bindDragElements(context) {
      var elements = (context || document).getElementsByClassName('drag-drawflow');
      for (var i = 0; i < elements.length; i++) {
        var el = elements[i];
        if (el.dataset.dragBound) continue;
        el.addEventListener('dragstart', drag, false);
        el.addEventListener('touchend', drop, false);
        el.addEventListener('touchmove', positionMobile, false);
        el.addEventListener('touchstart', drag, false);
        el.dataset.dragBound = 'true';
      }
    }

    bindDragElements(document);
    window.bindDrawflowDragElements = bindDragElements;

    var mobile_item_selec = '';
    var mobile_last_move = null;
   function positionMobile(ev) {
     mobile_last_move = ev;
   }

   function allowDrop(ev) {
      ev.preventDefault();
    }

    function drag(ev) {
      var target = ev.target.closest('.drag-drawflow');
      if (!target) return;
      var nodeType = target.getAttribute('data-node');
      var payload = nodeType;
      var ontologyIri = target.getAttribute('data-ontology-iri');
      var ontologyLabel = target.getAttribute('data-ontology-label');
      if (ontologyIri) {
        payload += '::' + encodeURIComponent(ontologyIri);
        if (ontologyLabel) {
          payload += '::' + encodeURIComponent(ontologyLabel);
        }
      }
      if (ev.type === "touchstart") {
        mobile_item_selec = payload;
      } else {
        ev.dataTransfer.setData("node", payload);
      }
    }

    function drop(ev) {
      if (ev.type === "touchend") {
        var parentdrawflow = document.elementFromPoint( mobile_last_move.touches[0].clientX, mobile_last_move.touches[0].clientY).closest("#drawflow");
        if(parentdrawflow != null) {
          addNodeToDrawFlow(mobile_item_selec, mobile_last_move.touches[0].clientX, mobile_last_move.touches[0].clientY);
        }
        mobile_item_selec = '';
      } else {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("node");
        addNodeToDrawFlow(data, ev.clientX, ev.clientY);
      }

    }

    function parseNodePayload(payload) {
      if (!payload) return { type: '', iri: '', label: '' };
      var parts = payload.split('::');
      return {
        type: parts[0],
        iri: parts[1] ? decodeURIComponent(parts[1]) : '',
        label: parts[2] ? decodeURIComponent(parts[2]) : ''
      };
    }

    function escapeHTML(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

  // API + Storage
  const API_BASE = '/api';

  async function apiRequest(path, options = {}) {
    const config = {
      headers: { 'Content-Type': 'application/json' },
      ...options
    };
    if (config.body && typeof config.body !== 'string') {
      config.body = JSON.stringify(config.body);
    }
    const response = await fetch(`${API_BASE}${path}`, config);
    if (!response.ok) {
      const message = await response.text();
      throw new Error(message || `Request failed: ${response.status}`);
    }
    return response.status === 204 ? null : response.json();
  }

  const ModuleStore = {
    modules: [],

    async refresh() {
      this.modules = await apiRequest('/modules');
      return this.modules;
    },

    getAll() {
      return this.modules;
    },

    getById(id) {
      return this.modules.find(m => m.id === id);
    },

    getCustomById(id) {
      const module = this.getById(id);
      return module && module.type === 'custom' ? module : null;
    },

    getBuiltInModules() {
      return this.modules.filter(m => m.type === 'builtin');
    }
  };

  const ModuleAPI = {
    async create(module) {
      return apiRequest('/modules', { method: 'POST', body: module });
    },

    async update(id, module) {
      return apiRequest(`/modules/${id}`, { method: 'PUT', body: module });
    },

    async delete(id) {
      return apiRequest(`/modules/${id}`, { method: 'DELETE' });
    },

    async importModules(modules) {
      return apiRequest('/modules/import', { method: 'POST', body: { modules } });
    }
  };

  const WorkflowAPI = {
    async list() {
      return apiRequest('/workflows');
    },

    async get(id) {
      return apiRequest(`/workflows/${id}`);
    },

    async create(payload) {
      return apiRequest('/workflows', { method: 'POST', body: payload });
    },

    async update(id, payload) {
      return apiRequest(`/workflows/${id}`, { method: 'PUT', body: payload });
    },

    async delete(id) {
      return apiRequest(`/workflows/${id}`, { method: 'DELETE' });
    }
  };

  let currentWorkflowId = null;
  let currentWorkflowTitle = '';
  let lastSavedSnapshot = '';

  function getDefaultWorkflowTitle() {
    const now = new Date();
    const stamp = now.toISOString().slice(0, 16).replace('T', ' ');
    return `Workflow ${stamp}`;
  }

  async function migrateLocalCustomModules() {
    const key = 'democracyRoutes_customModules';
    const raw = localStorage.getItem(key);
    if (!raw) return;
    try {
      const modules = JSON.parse(raw);
      if (!Array.isArray(modules) || modules.length === 0) {
        localStorage.removeItem(key);
        return;
      }
      const normalized = modules.map(module => ({ ...module, type: 'custom' }));
      await ModuleAPI.importModules(normalized);
      localStorage.removeItem(key);
    } catch (error) {
      console.error('Failed to migrate local modules:', error);
    }
  }

  // Template Generator
  const ModuleTemplateGenerator = {
    generateHTML(module) {
      const fields = module.fields.map(field => this.generateField(field)).join('\n                ');

      return `
              <div>
                <div class="title-box">
                  <i class="fas ${module.icon}"></i> ${module.name}
                </div>
                <div class="box">
                  ${fields}
                </div>
              </div>
              `;
    },

    generateField(field) {
      const requiredMark = field.required ? ' *' : '';

      switch (field.type) {
        case 'text':
        case 'url':
          return `<p>${field.label}${requiredMark}</p>
                  <input type="${field.type}" df-${field.slug} placeholder="${field.placeholder || ''}">`;

        case 'number':
          return `<p>${field.label}${requiredMark}</p>
                  <input type="number" df-${field.slug} placeholder="${field.placeholder || ''}">`;

        case 'textarea':
          return `<p>${field.label}${requiredMark}</p>
                  <textarea df-${field.slug} placeholder="${field.placeholder || ''}"></textarea>`;

        case 'select':
          const options = (field.options || []).map(opt =>
            `<option value="${this.sanitize(opt)}">${opt}</option>`
          ).join('\n                  ');
          return `<p>${field.label}${requiredMark}</p>
                  <select df-${field.slug}>
                    ${options}
                  </select>`;

        case 'checkbox':
          const checkboxId = `${field.slug}-checkbox`;
          return `<p>${field.label}${requiredMark}</p>
                  <input type="checkbox" df-${field.slug} id="${checkboxId}">
                  <label for="${checkboxId}">${field.placeholder || 'Enable'}</label>`;

        default:
          return '';
      }
    },

    generateInitialData(module) {
      const data = {};
      module.fields.forEach(field => {
        const key = field.slug.replace(/-/g, '_');
        data[key] = field.defaultValue || '';
      });
      return data;
    },

    sanitize(text) {
      return String(text).replace(/[<>"']/g, '');
    }
  };

    initialize() {
      this.loadModuleList();
      this.setupIconPicker();
      this.populateCopyDropdown();

    addEventListeners() {
      const inputs = ['module-name', 'module-inputs', 'module-outputs'];
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', () => this.updatePreview());
      });
    },

    setupIconPicker() {
      const picker = document.getElementById('icon-picker');
      if (!picker) return;

      picker.innerHTML = ICON_LIST.map(icon =>
        `<div class="icon-item" data-icon="${icon}" onclick="ModuleEditorUI.selectIcon('${icon}')">
          <i class="fas ${icon}"></i>
        </div>`
      ).join('');
    },

    selectIcon(iconClass) {
      document.querySelectorAll('.icon-item').forEach(el => el.classList.remove('selected'));
      const selected = document.querySelector(`[data-icon="${iconClass}"]`);
      if (selected) {
        selected.classList.add('selected');
        this.updatePreview();
      }
    },

    loadModuleList() {
      const modules = ModuleStore.getAll();
      const listEl = document.getElementById('module-list');

      if (modules.length === 0) {
        listEl.innerHTML = '<p class="empty-state">No custom modules yet</p>';
        return;
      }

      listEl.innerHTML = modules.map(m => `
        <div class="module-list-item ${m.id === this.currentModuleId ? 'active' : ''}" 
             onclick="ModuleEditorUI.loadModule('${m.id}')">
          <i class="fas ${m.icon}"></i>
          <span>${m.name}</span>
        </div>
      `).join('');
    },

    populateCopyDropdown() {
      const dropdown = document.getElementById('copy-from-module');
      if (!dropdown) return;

      const builtInModules = ModuleStore.getBuiltInModules();
      const customModules = ModuleStore.getAll().filter(module => module.type === 'custom');

      let html = '<option value="">-- Start from scratch --</option>';
      html += '<optgroup label="Built-in Modules">';
      builtInModules.forEach(m => {
        html += `<option value="builtin:${m.id}">${m.name}</option>`;
      });
      html += '</optgroup>';

      if (customModules.length > 0) {
        html += '<optgroup label="Custom Modules">';
        customModules.forEach(m => {
          html += `<option value="custom:${m.id}">${m.name}</option>`;
        });
        html += '</optgroup>';
      }

      dropdown.innerHTML = html;
    },

    loadModule(id) {
      const module = ModuleStore.getById(id);
      if (!module) return;

      this.currentModuleId = id;
      this.currentFieldId = 0;
      this.currentModuleType = module.type || 'custom';

      document.getElementById('module-name').value = module.name;
      document.getElementById('module-inputs').value = module.inputs;
      document.getElementById('module-outputs').value = module.outputs;

      this.selectIcon(module.icon);

      const container = document.getElementById('fields-container');
      container.innerHTML = '';
      module.fields.forEach(field => {
        this.addFieldRow(field);
      });

      document.getElementById('delete-btn').style.display = 'block';

      this.loadModuleList();
      this.updatePreview();
    },

    createNewModule() {
      this.currentModuleId = null;
      this.currentFieldId = 0;
      this.currentModuleType = 'custom';

      document.getElementById('module-name').value = '';
      document.getElementById('module-inputs').value = '1';
      document.getElementById('module-outputs').value = '1';
      document.getElementById('copy-from-module').value = '';
      document.getElementById('fields-container').innerHTML = '';

      document.querySelectorAll('.icon-item').forEach(el => el.classList.remove('selected'));
      document.getElementById('delete-btn').style.display = 'none';

      this.loadModuleList();
      this.updatePreview();
    },

    copyFromModule() {
      const dropdown = document.getElementById('copy-from-module');
      const value = dropdown.value;

      if (!value) {
        this.createNewModule();
        return;
      }

      const [type, id] = value.split(':');

      const module = ModuleStore.getById(id);
      if (module) {
        document.getElementById('module-name').value = module.name + ' Copy';
        document.getElementById('module-inputs').value = module.inputs;
        document.getElementById('module-outputs').value = module.outputs;
        this.selectIcon(module.icon);

        const container = document.getElementById('fields-container');
        container.innerHTML = '';
        module.fields.forEach(field => {
          this.addFieldRow({ ...field });
        });
      }

      this.updatePreview();
    },

    addField(fieldData = null) {
      const fieldId = `field_${this.currentFieldId++}`;
      const field = fieldData || {
        id: fieldId,
        type: 'text',
        label: '',
        slug: '',
        placeholder: '',
        required: false,
        options: [],
        defaultValue: ''
      };

      this.addFieldRow(field);
      this.updatePreview();
    },

    addFieldRow(field) {
      const container = document.getElementById('fields-container');
      const fieldDiv = document.createElement('div');
      fieldDiv.className = 'field-editor-row';
      fieldDiv.dataset.fieldId = field.id;

      const showOptions = field.type === 'select';
      const showPlaceholder = ['text', 'number', 'textarea', 'url', 'checkbox'].includes(field.type);

      fieldDiv.innerHTML = `
        <div class="field-controls">
          <div class="field-row">
            <select class="field-type-select" onchange="ModuleEditorUI.updateFieldType(this)">
              <option value="text" ${field.type === 'text' ? 'selected' : ''}>Text</option>
              <option value="number" ${field.type === 'number' ? 'selected' : ''}>Number</option>
              <option value="textarea" ${field.type === 'textarea' ? 'selected' : ''}>Text Area</option>
              <option value="select" ${field.type === 'select' ? 'selected' : ''}>Select</option>
              <option value="checkbox" ${field.type === 'checkbox' ? 'selected' : ''}>Checkbox</option>
              <option value="url" ${field.type === 'url' ? 'selected' : ''}>URL</option>
            </select>
            <input type="text" class="field-label-input" placeholder="Label" value="${field.label || ''}">
            <input type="text" class="field-slug-input" placeholder="slug" value="${field.slug || ''}">
          </div>
          <div class="field-row" style="display: ${showPlaceholder ? 'flex' : 'none'};">
            <input type="text" class="field-placeholder-input" placeholder="Placeholder / Checkbox label" value="${field.placeholder || ''}">
          </div>
          <div class="field-row" style="display: ${showOptions ? 'flex' : 'none'};">
            <input type="text" class="field-options-input" placeholder="Options (comma-separated)" value="${(field.options || []).join(', ')}">
          </div>
          <div class="field-row">
            <label style="margin: 0;">
              <input type="checkbox" class="field-required-check" ${field.required ? 'checked' : ''}> Required
            </label>
          </div>
        </div>
        <button class="btn-remove-field" onclick="ModuleEditorUI.removeField(this)">
          <i class="fas fa-trash"></i>
        </button>
      `;

      container.appendChild(fieldDiv);

      // Add event listeners
      fieldDiv.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', () => this.updatePreview());
        el.addEventListener('change', () => this.updatePreview());
      });
    },

    updateFieldType(selectEl) {
      const row = selectEl.closest('.field-editor-row');
      const type = selectEl.value;

      const placeholderRow = row.querySelectorAll('.field-row')[1];
      const optionsRow = row.querySelectorAll('.field-row')[2];

      const showPlaceholder = ['text', 'number', 'textarea', 'url', 'checkbox'].includes(type);
      const showOptions = type === 'select';

      placeholderRow.style.display = showPlaceholder ? 'flex' : 'none';
      optionsRow.style.display = showOptions ? 'flex' : 'none';

      this.updatePreview();
    },

    removeField(btn) {
      btn.closest('.field-editor-row').remove();
      this.updatePreview();
    },

    collectFormData() {
      const name = document.getElementById('module-name').value.trim();
      const inputs = parseInt(document.getElementById('module-inputs').value) || 1;
      const outputs = parseInt(document.getElementById('module-outputs').value) || 1;
      const selectedIcon = document.querySelector('.icon-item.selected');
      const icon = selectedIcon ? selectedIcon.dataset.icon : 'fa-cogs';

      const fields = [];
      document.querySelectorAll('.field-editor-row').forEach(row => {
        const type = row.querySelector('.field-type-select').value;
        const label = row.querySelector('.field-label-input').value.trim();
        const slug = row.querySelector('.field-slug-input').value.trim() ||
                      label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const placeholder = row.querySelector('.field-placeholder-input')?.value.trim() || '';
        const required = row.querySelector('.field-required-check').checked;
        const optionsInput = row.querySelector('.field-options-input')?.value || '';
        const options = type === 'select' ? optionsInput.split(',').map(s => s.trim()).filter(s => s) : [];

        if (label) {
          fields.push({
            id: row.dataset.fieldId,
            type,
            label,
            slug,
            placeholder,
            required,
            options,
            defaultValue: ''
          });
        }
      });

      return { name, inputs, outputs, icon, fields };
    },

    validateModule(data) {
      if (!data.name) {
        alert('Please enter a module name');
        return false;
      }

      if (data.fields.length === 0) {
        alert('Please add at least one field');
        return false;
      }

      const slugs = data.fields.map(f => f.slug);
      const duplicates = slugs.filter((s, i) => slugs.indexOf(s) !== i);
      if (duplicates.length > 0) {
        alert(`Duplicate field slugs found: ${duplicates.join(', ')}`);
        return false;
      }

      return true;
    },

    async saveModule() {
      const data = this.collectFormData();

      if (!this.validateModule(data)) {
        return;
      }

      const slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      const timestamp = Date.now();
      const payload = {
        ...data,
        slug,
        type: this.currentModuleType || 'custom'
      };

      if (this.currentModuleId) {
        // Update existing
        await ModuleAPI.update(this.currentModuleId, payload);
      } else {
        // Create new
        const module = {
          id: `custom_${slug}_${timestamp}`,
          ...payload,
          type: 'custom',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        const saved = await ModuleAPI.create(module);
        this.currentModuleId = saved && saved.id ? saved.id : module.id;
        this.currentModuleType = 'custom';
        document.getElementById('delete-btn').style.display = 'block';
      }

      await ModuleStore.refresh();
      this.loadModuleList();
      this.populateCopyDropdown();
      loadModulesIntoPalette();

      Swal.fire({
        icon: 'success',
        title: 'Saved!',
        text: 'Module saved successfully',
        timer: 1500,
        showConfirmButton: false
      });
    },

    async deleteModule() {
      if (!this.currentModuleId) return;

      if (confirm('Are you sure you want to delete this module?')) {
        await ModuleAPI.delete(this.currentModuleId);
        this.createNewModule();
        await ModuleStore.refresh();
        this.populateCopyDropdown();
        loadModulesIntoPalette();

        Swal.fire({
          icon: 'success',
          title: 'Deleted!',
          text: 'Module deleted successfully',
          timer: 1500,
          showConfirmButton: false
        });
      }
    },

    updatePreview() {
      const data = this.collectFormData();
      const preview = document.getElementById('preview-container');

      if (!data.name || data.fields.length === 0) {
        preview.innerHTML = '<p style="color: #999; text-align: center;">Fill in the form to see a preview</p>';
        return;
      }

      const html = ModuleTemplateGenerator.generateHTML(data);
      preview.innerHTML = `<div class="drawflow-node">${html}</div>`;
    }
  };

  // Load custom modules into palette on page load
  async function loadModulesIntoPalette() {
    const palette = document.querySelector('.col');
    if (!palette) return;

    // Remove existing palette modules
    palette.querySelectorAll('.drag-drawflow.db-module').forEach(el => el.remove());

    const modules = await ModuleStore.refresh();

    // Find the module editor trigger as insertion point
    const trigger = palette.querySelector('.module-editor-trigger');
    const insertionPoint = trigger ? trigger.nextSibling : palette.firstChild;

    modules.forEach(module => {
      const moduleEl = document.createElement('div');
      moduleEl.className = `drag-drawflow db-module${module.type === 'custom' ? ' custom-module' : ''}`;
      moduleEl.draggable = true;
      moduleEl.setAttribute('data-node', module.id);
      moduleEl.innerHTML = `<i class="fas ${module.icon}"></i><span> ${module.name}</span>`;

      palette.insertBefore(moduleEl, insertionPoint);
    });

    bindDragElements(palette);
  }

  async function loadWorkflowPanel() {
    const listEl = document.getElementById('workflow-panel-list');
    if (!listEl) return;

    try {
      const workflows = await WorkflowAPI.list();
      if (workflows.length === 0) {
        listEl.innerHTML = '<p class="empty-state">No workflows saved yet</p>';
        return;
      }

      listEl.innerHTML = workflows.map(workflow => `
        <div class="workflow-panel-item" data-id="${workflow.id}">
          <div class="workflow-title">${escapeHTML(workflow.title)}</div>
        </div>
      `).join('');

      listEl.querySelectorAll('.workflow-panel-item').forEach(item => {
        const workflowId = item.dataset.id;
        item.addEventListener('click', async () => {
          await attemptLoadWorkflow(workflowId);
        });
      });
    } catch (error) {
      console.error('Failed to load workflow panel:', error);
      listEl.innerHTML = '<p class="empty-state">Failed to load workflows</p>';
    }
  }

  function createNewWorkflow() {
    currentWorkflowId = null;
    currentWorkflowTitle = '';
    editor.clearModuleSelected();
    lastSavedSnapshot = '';
  }

  async function attemptLoadWorkflow(workflowId) {
    if (!workflowId) return;
    const isDirty = hasUnsavedChanges();

    if (!isDirty) {
      await loadWorkflowById(workflowId);
      return;
    }

    const result = await Swal.fire({
      title: 'Unsaved changes',
      text: 'Do you want to save the current workflow before loading another?',
      icon: 'warning',
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: 'Save & Load',
      denyButtonText: 'Load Without Saving',
      cancelButtonText: 'Cancel'
    });

    if (result.isConfirmed) {
      await saveFlow();
      await loadWorkflowById(workflowId);
    } else if (result.isDenied) {
      await loadWorkflowById(workflowId);
    }
  }

  async function loadWorkflowById(workflowId) {
    const workflow = await WorkflowAPI.get(workflowId);
    editor.import(workflow.drawflow);
    editor.changeModule('Home');
    currentWorkflowId = workflow.id;
    currentWorkflowTitle = workflow.title;
    lastSavedSnapshot = JSON.stringify(workflow.drawflow || {});
  }

  function hasUnsavedChanges() {
    if (!currentWorkflowId) return false;
    const current = JSON.stringify(editor.export());
    return current !== lastSavedSnapshot;
  }

  async function renameCurrentWorkflow() {
    if (!currentWorkflowId) {
      Swal.fire('No workflow loaded', 'Load a workflow first.', 'info');
      return;
    }
    const result = await Swal.fire({
      title: 'Rename workflow',
      input: 'text',
      inputValue: currentWorkflowTitle || '',
      showCancelButton: true,
      confirmButtonText: 'Save'
    });
    if (result.isConfirmed && result.value && result.value.trim()) {
      const newTitle = result.value.trim();
      await WorkflowAPI.update(currentWorkflowId, { title: newTitle });
      currentWorkflowTitle = newTitle;
      loadWorkflowPanel();
    }
  }

  async function deleteCurrentWorkflow() {
    if (!currentWorkflowId) {
      Swal.fire('No workflow loaded', 'Load a workflow first.', 'info');
      return;
    }
    const confirmation = await Swal.fire({
      title: 'Delete workflow?',
      text: 'This cannot be undone.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Delete'
    });
    if (confirmation.isConfirmed) {
      await WorkflowAPI.delete(currentWorkflowId);
      currentWorkflowId = null;
      currentWorkflowTitle = '';
      loadWorkflowPanel();
    }
  }

  function toggleWorkflowSidebar() {
    const sidebar = document.getElementById('workflow-sidebar');
    if (!sidebar) return;
    sidebar.classList.toggle('collapsed');
  }

  function toggleModuleSidebar() {
    const moduleCol = document.querySelector('.col');
    if (!moduleCol) return;
    moduleCol.classList.toggle('collapsed');
  }
  </script>
</body>
</html>
